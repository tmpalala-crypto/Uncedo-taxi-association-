<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNCEDO SERVICE TAXI ASSOCIATION</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f4f8}
.header{background:#0a1931;color:white;text-align:center;padding:12px 8px;border-bottom:4px solid #ffcc00}
.header h1{font-size:16px;font-weight:bold}
.tabs{display:flex;gap:8px;padding:12px;background:#0a1931}
.tab{flex:1;padding:10px;border-radius:12px;border:none;font-weight:bold;font-size:13px;cursor:pointer}
.tab.active{background:white;color:#0a1931}
.tab.inactive{background:#e8eef8;color:#0a1931}
.card{background:white;margin:12px;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
#map{height:260px;border-radius:12px;border:2px solid #0a1931;margin-top:10px}
.badge{background:#fff8d6;padding:8px 10px;border-radius:8px;font-size:12px;margin-top:10px}
.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:10px;font-size:14px}
.btn-primary{width:100%;background:#0a1931;color:white;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:15px;margin-top:14px;cursor:pointer}
.btn-yellow{width:100%;background:#ffcc00;color:#0a1931;padding:12px;border:none;border-radius:12px;font-weight:bold;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h1>UNCEDO SERVICE TAXI ASSOCIATION</h1><p>EST. 1983 PORT ELIZABETH • LONG DISTANCE</p></div>
<div class="tabs">
<button class="tab active" onclick="showTab('book')">🚕 Book Ride</button>
<button class="tab inactive" onclick="showTab('complain')">⚠️ Complain</button>
<button class="tab inactive" onclick="location.href='executive.html'">👨‍💼 Exec</button>
</div>
<div id="bookTab">
<div class="card"><h2>Book Your Ride</h2><div id="map"></div><div class="badge" id="gpsStatus">📍 Tap map or Allow GPS - PE Taxi Rank</div></div>
<div class="card">
<div id="pickupText" style="font-size:13px;font-weight:bold">Current: PE Taxi Rank, Gqeberha</div>
<input id="fullName" class="input" placeholder="Your Full Name">
<input id="phone" class="input" placeholder="Phone 060 314 2346">
<select id="route" class="input">
<option>Gqeberha → Johannesburg - R850</option>
<option>Gqeberha → Cape Town - R650</option>
<option>Gqeberha → Durban - R750</option>
</select>
<button class="btn-primary" onclick="confirmBooking()">CONFIRM & BOOK RIDE</button>
<button class="btn-yellow">🎫 TAXI QR CODE</button>
</div>
</div>
<div id="complainTab" style="display:none"><div class="card">
<h2>Report Complaint</h2>
<input id="cName" class="input" placeholder="Your Name">
<input id="cTaxi" class="input" placeholder="Taxi Number">
<textarea id="cMsg" class="input" placeholder="Complaint..."></textarea>
<button class="btn-primary" onclick="sendComplaint()">SEND TO WHATSAPP 0603142346</button>
</div></div>
<script>
let defaultLat=-33.9608,defaultLng=25.6022,selectedLat=defaultLat,selectedLng=defaultLng;
let map=L.map('map').setView([defaultLat,defaultLng],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker=L.marker([defaultLat,defaultLng],{draggable:true}).addTo(map);
map.on('click',function(e){selectedLat=e.latlng.lat;selectedLng=e.latlng.lng;marker.setLatLng([selectedLat,selectedLng]);document.getElementById('pickupText').innerText="Current: "+selectedLat.toFixed(5)+", "+selectedLng.toFixed(5);});
function confirmBooking(){let name=document.getElementById('fullName').value;let phone=document.getElementById('phone').value;let route=document.getElementById('route').value;let msg=`*UNCEDO BOOKING*%0AName:${name}%0APhone:${phone}%0ARoute:${route}%0ALoc:https://maps.google.com/?q=${selectedLat},${selectedLng}`;window.open(`https://wa.me/27603142346?text=${msg}`,'_blank');}
function sendComplaint(){let msg=`*COMPLAINT*%0A${document.getElementById('cMsg').value}`;window.open(`https://wa.me/27603142346?text=${msg}`,'_blank');}
function showTab(t){document.getElementById('bookTab').style.display=t==='book'?'block':'none';document.getElementById('complainTab').style.display=t==='complain'?'block':'none';}
</script>
</body>
</html>
