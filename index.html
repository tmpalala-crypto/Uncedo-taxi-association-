<div id="app" style="max-width:400px;margin:auto;font-family:Arial">
  <h2 style="background:#0A1931;color:#FFC107;padding:15px">UNCEDO SERVICE • 8 ROUTES</h2>
  <div id="routes"></div>
  <div id="seats" style="display:none">
    <h3>Select Seat - 15 Seats</h3>
    <div id="seatMap" style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"></div>
    <button onclick="confirmBooking()" style="background:#FFC107;width:100%;padding:15px;margin-top:20px;font-weight:bold">CONTINUE • PAY</button>
  </div>
</div>
<script>
const routes = [
 {code:'R1',dest:'Johannesburg',fare:850,time:'10h 30m'},
 {code:'R5',dest:'Knysna (Garden Route)',fare:450,time:'3h 20m'},
 {code:'R6',dest:'Plett',fare:480,time:'3h 45m'},
];
let selectedRoute, selectedSeat;
routes.forEach(r=>{
  document.getElementById('routes').innerHTML += `<div onclick="selectRoute('${r.code}',${r.fare})" style="border:1px solid #ccc;padding:10px;margin:5px;border-radius:10px">PE → ${r.dest} - R${r.fare} - ${r.time}</div>`;
});
function selectRoute(code,fare){
  selectedRoute=code;
  document.getElementById('routes').style.display='none';
  document.getElementById('seats').style.display='block';
  for(let i=1;i<=15;i++){
    document.getElementById('seatMap').innerHTML += `<div onclick="selectSeat(${i})" id="s${i}" style="background:#ddd;padding:15px;text-align:center;border-radius:10px;cursor:pointer">${i}</div>`;
  }
}
function selectSeat(n){
  if(selectedSeat) document.getElementById('s'+selectedSeat).style.background='#ddd';
  selectedSeat=n;
  document.getElementById('s'+n).style.background='#FFC107';
}
function confirmBooking(){
  alert(`BOOKING CONFIRMED! Route ${selectedRoute} Seat ${selectedSeat} - Show this to driver. Driver selfie verification required.`);
}
</script>
