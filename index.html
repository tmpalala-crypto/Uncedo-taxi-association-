<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uncedo Service Taxi Association</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f0f0f0}
.top{background:#002855;color:white;padding:10px;text-align:center;display:flex;align-items:center;justify-content:center;gap:12px}
.top img{width:55px;height:65px;background:white;border-radius:8px;padding:2px}
.card{background:#fff;margin:10px;padding:15px;border-radius:14px;box-shadow:0 2px 8px #ccc}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;color:white;background:#002855;margin-top:10px;font-size:16px}
.yellow{background:#FFD700!important;color:#002855!important}
#map{height:260px}
video, #selfie{width:100%;border-radius:10px;background:#000;margin-top:5px}
.tabs{display:flex;gap:5px;margin:10px}
.tab{flex:1;padding:10px;border-radius:8px;border:none;font-weight:bold;background:#ddd}
.tab.active{background:#002855;color:white}
</style>
</head><body>
<div class="top">
<img src="logo.png">
<div><b>UNCEDO SERVICE<br>TAXI ASSOCIATION</b><br><small>EST. 1983 PORT ELIZABETH<br>LONG DISTANCE</small></div>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('book')">🚕 Book</button>
<button class="tab" onclick="showTab('complaint')">⚠️ Complain / Compliment</button>
</div>

<div id="map"></div>

<div id="bookTab">
<div class="card">
<h3>Request Pickup to Rank</h3>
<video id="cam" autoplay playsinline></video>
<button onclick="takePic()" style="padding:8px">📸 Take Selfie (Safety)</button>
<canvas id="canvas" style="display:none"></canvas><img id="selfie" style="display:none">
<input id="name" placeholder="Your Full Name">
<input id="phone" placeholder="Phone e.g. 0731234567">
<select id="dest">
<option>Peddie - R120</option><option>Makhanda - R150</option><option>Port Alfred - R180</option>
<option>East London - R250</option><option>Queenstown - R350</option><option>Mthatha - R400</option>
<option>Cape Town - R600</option><option>Johannesburg - R750</option><option>Durban - R650</option>
</select>
<p id="gps" style="font-weight:bold;color:#002855">📍 Getting GPS...</p>
<button class="btn" onclick="requestPickup()">REQUEST PICKUP</button>
<a href="verify.html"><button class="btn yellow">🔍 SCAN TAXI QR</button></a>
</div>
</div>

<div id="complaintTab" style="display:none">
<div class="card">
<h3>⚠️ Complaint / Compliment / Report</h3>
<select id="type">
<option value="Complaint">😡 Complaint - Bad Service</option>
<option value="Compliment">😊 Compliment - Good Driver</option>
<option value="Overloading">⚠️ Overloading / Reckless</option>
<option value="Fare">💰 Overcharging</option>
<option value="Lost Item">🔍 Lost Item in Taxi</option>
</select>
<input id="cName" placeholder="Your Name">
<input id="cPhone" placeholder="Your Phone">
<input id="taxiReg" placeholder="Taxi Reg No e.g. HFT 123 EC (if you know)">
<textarea id="message" rows="4" placeholder="What happened? Describe..."></textarea>
<label>📹 Upload Video Evidence (Optional):</label>
<input type="file" id="videoFile" accept="video/*,image/*" capture="environment">
<video id="previewVideo" style="display:none" controls></video>
<img id="previewImg" style="display:none;width:100%;border-radius:10px">
<button class="btn" style="background:#cc0000" onclick="submitComplaint()">SUBMIT COMPLAINT + VIDEO</button>
<p style="font-size:11px">Your complaint goes to Uncedo Executive Dashboard. Video saved as evidence.</p>
</div>
</div>

<div class="card" style="text-align:center">
<a href="executive.html" style="font-size:13px">🔐 Executive Login → Dashboard</a>
</div>

<script>
let lat=-33.874,lng=25.56;
let map=L.map('map').setView([lat,lng],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let m=L.marker([lat,lng],{draggable:true}).addTo(map);
function updateGPS(){document.getElementById('gps').innerHTML=`📍 Pin: ${lat.toFixed(5)}, ${lng.toFixed(5)} <br><a href='https://maps.google.com/?q=${lat},${lng}' target='_blank'>Open Maps</a>`}
m.on('dragend',e=>{lat=e.target.getLatLng().lat; lng=e.target.getLatLng().lng; updateGPS();});
navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.lat; lng=p.coords.lng; map.setView([lat,lng],16); m.setLatLng([lat,lng]); updateGPS();},()=>updateGPS()); updateGPS();
navigator.mediaDevices.getUserMedia({video:true}).then(s=>document.getElementById('cam').srcObject=s).catch(()=>{});
function takePic(){let v=document.getElementById('cam'),c=document.getElementById('canvas'),img=document.getElementById('selfie'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); img.src=c.toDataURL('image/png'); img.style.display='block';}
function showTab(t){document.getElementById('bookTab').style.display=t=='book'?'block':'none'; document.getElementById('complaintTab').style.display=t=='complaint'?'block':'none'; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); event.target.classList.add('active');}
function requestPickup(){let n=document.getElementById('name').value, p=document.getElementById('phone').value; if(!n||!p){alert('Add name & phone');return} let msg=`*UNCEDO PICKUP*%0AName:${n}%0APhone:${p}%0ATo:${document.getElementById('dest').value}%0ALoc:https://maps.google.com/?q=${lat},${lng}`; window.open(`https://wa.me/27731234567?text=${msg}`,'_blank');}
document.getElementById('videoFile').addEventListener('change',function(e){let file=e.target.files[0]; if(!file)return; let url=URL.createObjectURL(file); if(file.type.startsWith('video')){document.getElementById('previewVideo').src=url; document.getElementById('previewVideo').style.display='block'; document.getElementById('previewImg').style.display='none';}else{document.getElementById('previewImg').src=url; document.getElementById('previewImg').style.display='block'; document.getElementById('previewVideo').style.display='none';}});
function submitComplaint(){
 let data={
  type:document.getElementById('type').value,
  name:document.getElementById('cName').value,
  phone:document.getElementById('cPhone').value,
  reg:document.getElementById('taxiReg').value,
  msg:document.getElementById('message').value,
  date:new Date().toLocaleString(),
  gps:`${lat},${lng}`
 };
 if(!data.name||!data.msg){alert('Add name & message');return}
 // Save to localStorage for executive dashboard
 let all=JSON.parse(localStorage.getItem('uncedo_complaints')||'[]');
 // handle video
 let file=document.getElementById('videoFile').files[0];
 if(file){
  let reader=new FileReader();
  reader.onload=function(ev){
   data.evidence=ev.target.result; // base64
   all.push(data); localStorage.setItem('uncedo_complaints',JSON.stringify(all));
   alert('Complaint + Video Saved! Executive will see it.');
   let wa=`*${data.type}*%0AName:${data.name}%0APhone:${data.phone}%0ATaxi:${data.reg}%0AMsg:${data.msg}%0ALocation:${data.gps}%0A_Video attached in dashboard_`;
   window.open(`https://wa.me/27731234567?text=${wa}`,'_blank');
  };
  reader.readAsDataURL(file);
 } else {
  all.push(data); localStorage.setItem('uncedo_complaints',JSON.stringify(all));
  alert('Complaint Saved! Executive will see it.');
  let wa=`*${data.type}*%0AName:${data.name}%0APhone:${data.phone}%0ATaxi:${data.reg}%0AMsg:${data.msg}`;
  window.open(`https://wa.me/27731234567?text=${wa}`,'_blank');
 }
}
</script>
</body></html>
